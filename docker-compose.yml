# nexcanvas, start with:  docker compose up -d --build
#
# Then open http://<your-host>:8500. The first account you create there is the operator; it needs the setup code
# from the log (docker logs nexcanvas) or the one you set below.

services:
  nexcanvas:
    build: .
    container_name: nexcanvas
    restart: unless-stopped

    ports:
      # Host port on the left, container port on the right.
      - "8500:8000"

    volumes:
      # Database, photos and files of the boards (data/media), logs, backups and the operator's own languages.
      # A local disk, never an SMB or NFS share: SQLite's locking does not work reliably over network filesystems.
      - ./data:/data

    environment:
      # Who should own the files in the data directory. The container fixes the permissions itself on startup.
      PUID: 1000
      PGID: 1000

      TZ: Europe/Berlin

      # The address people use to reach nexcanvas, for invitation links, public pages and the OIDC redirect. Can
      # also be set in the interface.
      # NEXCANVAS_PUBLIC_URL: https://boards.example.com

      # Behind a reverse proxy: its address, so that the brake against password guessing sees the real sender.
      # The proxy must pass WebSockets through (the boards are edited live over /api/boards/<id>/live).
      # NEXCANVAS_TRUSTED_PROXIES: 172.16.0.0/12

      # The code the first account needs. Without it nexcanvas makes one at every start until it is set up and
      # writes it to the log: docker logs nexcanvas
      # NEXCANVAS_SETUP_TOKEN: choose-a-long-one

      # The largest photo or file in megabytes (the operator can lower it in the settings).
      # NEXCANVAS_UPLOAD_MAX_MB: 50
