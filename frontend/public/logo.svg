<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="nexcanvas">
  <!-- An easel with a canvas, a sun and hills on it, on a white tile; dark when the system is dark.
       Same shape as components/Logo.tsx; the source is nexapps/icons-vergleich/neu.py. -->
  <style>
    .ground { fill: #fff } .rim { stroke: #f2643f; stroke-opacity: .35 } .sun { fill: #d9481f } .hills { stroke: #d9481f }
    .v1 { stop-color: #ffb39c } .v2 { stop-color: #f2643f } .v3 { stop-color: #a8361a }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #170d0a } .rim { stroke: #ff8a70; stroke-opacity: .45 } .sun { fill: #ffa58c } .hills { stroke: #ffa58c }
      .v1 { stop-color: #ffe4dc } .v2 { stop-color: #ff8a70 } .v3 { stop-color: #d9562f }
    }
  </style>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="54" y2="54">
      <stop offset="0" class="v1"/><stop offset=".5" class="v2"/><stop offset="1" class="v3"/>
    </linearGradient>
  </defs>
  <rect class="ground" x="2" y="2" width="60" height="60" rx="16"/>
  <rect class="rim" x="2.75" y="2.75" width="58.5" height="58.5" rx="15.3" fill="none" stroke-width="1.5"/>
  <path d="M22 38 17 53M42 38 47 53M32 38V50" stroke="url(#g)" stroke-width="3.6" stroke-linecap="round"/>
  <rect class="ground" x="15" y="11.5" width="34" height="25.5" rx="2.5" stroke="url(#g)" stroke-width="4.2"/>
  <path d="M12.5 38h39" stroke="url(#g)" stroke-width="4.2" stroke-linecap="round"/>
  <circle class="sun" cx="24.5" cy="20.5" r="3.4"/>
  <path class="hills" d="M20 32.5l7.5-7 5 4.5 4-4.5 7.5 7" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
